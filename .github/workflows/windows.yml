# Bygger Windows-installeren for ArkiPDF.
#
# - Hver push og pull request gir en installer som artefakt på kjøringen
#   (Actions → «Windows-bygg» → Artifacts).
# - En tagg som «v0.1.0» lager i tillegg en GitHub-release med
#   installeren vedlagt. Det samme gjør en manuell kjøring (Actions →
#   «Windows-bygg» → Run workflow) der feltet «release» er fylt ut; da
#   lager GitHub taggen selv på commiten som bygges.

name: Windows-bygg

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Lag release med denne taggen (f.eks. v0.1.0). La stå tom for bare å bygge."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    env:
      # Tagg for release: fra pushet tagg eller fra manuell kjøring.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release || '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Installer avhengigheter
        run: npm ci

      - name: Selvtest av PDF-redigering
        run: npm test

      - name: Bygg installer
        if: ${{ env.RELEASE_TAG == '' }}
        run: npx tauri build

      - name: Last opp installer
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ArkiPDF-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Bygg og publiser release
        if: ${{ env.RELEASE_TAG != '' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "ArkiPDF ${{ env.RELEASE_TAG }}"
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            **Installer:** last ned `ArkiPDF_*_x64-setup.exe` under «Assets» og kjør den. Den installeres for din bruker, uten administratorrettigheter. Windows kan advare fordi installeren ikke er signert: velg «Mer informasjon» → «Kjør likevel».

            Se [README](https://github.com/${{ github.repository }}#readme) for funksjoner og tastatursnarveier.
          releaseDraft: false
